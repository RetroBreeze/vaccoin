<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#142a36" />
    <meta
      name="description"
      content="One vacuum. One minute. An unreasonable amount of gold. A fast, pixelated 3D arcade game."
    />
    <title>VACCOIN</title>
  </head>
  <body>
    <canvas id="world" aria-label="Vaccoin 3D arena"></canvas
    ><canvas id="ui" aria-label="Vaccoin game interface"></canvas
    ><button id="play" aria-label="Play Vaccoin">Play</button
    ><button id="sound" aria-label="Mute sound">Sound</button>
    <div id="player-name" hidden>
      <label for="display-name">DISPLAY NAME</label>
      <input
        id="display-name"
        type="text"
        autocomplete="nickname"
        spellcheck="false"
        placeholder="Your name"
        aria-describedby="name-help"
      />
      <span id="name-help">3–24 characters</span>
    </div>
    <p id="status" role="status" aria-live="polite">Loading...</p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
