<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#142a36" />
    <meta
      name="description"
      content="One vacuum. One minute. An unreasonable amount of gold. A fast, pixelated 3D arcade game."
    />
    <title>VACCOIN</title>
  </head>
  <body>
    <canvas id="world" aria-label="Vaccoin 3D arena"></canvas
    ><canvas id="ui" aria-label="Vaccoin game interface"></canvas
    ><button id="play" aria-label="Play Vaccoin">Play</button
    ><button id="sound" aria-label="Mute sound">Sound</button>
    <button
      id="fullscreen"
      class="utility"
      aria-label="Enter fullscreen"
      title="Fullscreen (F)"
    >
      [ ]
    </button>
    <button
      id="pause"
      class="utility"
      aria-label="Pause controls"
      title="Pause controls"
      hidden
    >
      II
    </button>
    <p id="display-message" role="status" hidden></p>
    <div id="rotate-device" role="status" hidden>
      <strong>ROTATE TO PLAY</strong>
      <span>Turn your device to landscape</span>
      <button id="rotate-fullscreen">TRY LANDSCAPE FULLSCREEN</button>
    </div>
    <div id="touch-controls" hidden aria-label="Touch game controls">
      <div id="touch-look" data-touch="look" aria-label="Drag to look">
        <span>LOOK</span>
      </div>
      <div id="touch-move" data-touch="move" aria-label="Drag to move">
        <span class="stick"></span><span class="touch-label">MOVE</span>
      </div>
      <button id="touch-jump" data-touch="jump" aria-label="Jump">JUMP</button>
      <button id="touch-vacuum" data-touch="vacuum" aria-label="Hold to vacuum">
        VAC
      </button>
    </div>
    <div id="saved-player-name" hidden>
      <strong id="current-player-name"></strong>
      <button id="change-name" type="button">Change name</button>
    </div>
    <div id="player-name" hidden>
      <label for="display-name">DISPLAY NAME</label>
      <input
        id="display-name"
        type="text"
        autocomplete="nickname"
        spellcheck="false"
        placeholder="Your name"
        aria-describedby="name-help"
      />
      <span id="name-help" role="status">3–24 characters</span>
      <div id="name-actions" hidden>
        <button id="save-name" type="button">Save</button>
        <button id="cancel-name" type="button">Cancel</button>
      </div>
    </div>
    <p id="status" role="status" aria-live="polite">Loading...</p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
