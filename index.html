<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#142a36" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="VACCOIN" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta
      name="description"
      content="One vacuum. One minute. An unreasonable amount of gold. A fast, pixelated 3D arcade game."
    />
    <link
      rel="preload"
      href="/assets/fonts/vaccoin-pixel.otf"
      as="font"
      type="font/otf"
      crossorigin
    />
    <title>VACCOIN</title>
  </head>
  <body>
    <section id="entry-screen" aria-label="Welcome to Vaccoin">
      <button
        id="enter-casino"
        type="button"
        disabled
        aria-label="Click or tap to start"
        aria-describedby="entry-display-help"
      >
        <img class="entry-logo" src="/assets/logo.png" alt="Vaccoin" />
        <span class="entry-prompt">LOADING…</span>
        <span id="entry-display-help" hidden></span>
      </button>
    </section>
    <canvas id="world" aria-label="Vaccoin 3D arena"></canvas
    ><canvas id="ui" aria-label="Vaccoin game interface"></canvas
    ><button id="play" aria-label="Play Vaccoin">Play</button
    ><button id="sound" aria-label="Mute sound">Sound</button>
    <button id="main-menu" class="utility" type="button" hidden>
      Main menu
    </button>
    <button
      id="pause"
      class="utility"
      aria-label="Pause controls"
      title="Pause controls"
      hidden
    >
      II
    </button>
    <p id="display-message" role="status" hidden></p>
    <div id="rotate-device" role="status" hidden>
      <strong>ROTATE TO PLAY</strong>
      <span>Turn your device to landscape</span>
      <button id="rotate-fullscreen">TRY LANDSCAPE FULLSCREEN</button>
    </div>
    <div id="touch-controls" hidden aria-label="Touch game controls">
      <div
        id="touch-look"
        data-touch="look"
        aria-label="Hold to vacuum, drag to aim, double tap to jump"
      ></div>
      <div
        id="touch-move"
        data-touch="move"
        aria-label="Swipe and hold to move, double tap to jump"
      ></div>
    </div>
    <div id="saved-player-name" hidden>
      <strong id="current-player-name"></strong>
      <button id="change-name" type="button">Change name</button>
    </div>
    <div id="player-name" hidden>
      <label for="display-name">DISPLAY NAME</label>
      <input
        id="display-name"
        type="text"
        autocomplete="nickname"
        spellcheck="false"
        placeholder="Your name"
        aria-describedby="name-help"
      />
      <span id="name-help" role="status">3–24 characters</span>
      <div id="name-actions" hidden>
        <button id="save-name" type="button">Save</button>
        <button id="cancel-name" type="button">Cancel</button>
      </div>
    </div>
    <p id="status" role="status" aria-live="polite">Loading...</p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
